version: 2

# One weekly pull request for all version updates (every ecosystem), so the
# strict up-to-date branch rule needs a single CI run. Security updates are
# not part of this group and still open immediately.
multi-ecosystem-groups:
  weekly-dependencies:
    schedule:
      interval: weekly
      day: saturday
      time: "09:25"
      timezone: Europe/Stockholm
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"

updates:
  - package-ecosystem: "pip"
    directory: "/"
    multi-ecosystem-group: weekly-dependencies
    patterns: ["*"]
    groups:
      security-minor-patch:
        applies-to: "security-updates"
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker"
    directory: "/"
    multi-ecosystem-group: weekly-dependencies
    patterns: ["*"]
    # Keep the reviewed Python 3.12 interpreter line; interpreter upgrades
    # require a dedicated regression and image security review.
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    groups:
      security-minor-patch:
        applies-to: "security-updates"
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Signal-only reviewed candidates for the shared MCP edge. Keep this separate
  # from runtime Dockerfile updates so an edge-watch PR never bundles a deployable
  # base-image change from the repository root.
  - package-ecosystem: "docker"
    directory: "/dependency-watch/edge-images"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps-edge-watch"

  # The isolated local-test-runner Dockerfile uses a separately reviewed,
  # SHA-pinned Python base image; proposals are not applied automatically.
  - package-ecosystem: "docker"
    directory: "/local-test-runner"
    multi-ecosystem-group: weekly-dependencies
    patterns: ["*"]
    # Keep the reviewed Python 3.12 interpreter line; interpreter upgrades
    # require a dedicated regression and image security review.
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    groups:
      security-minor-patch:
        applies-to: "security-updates"
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker-compose"
    directory: "/"
    multi-ecosystem-group: weekly-dependencies
    patterns: ["*"]
    groups:
      security-minor-patch:
        applies-to: "security-updates"
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    multi-ecosystem-group: weekly-dependencies
    patterns: ["*"]
    groups:
      security-minor-patch:
        applies-to: "security-updates"
        patterns: ["*"]
        update-types: ["minor", "patch"]
