name: Secure local regression runner tests

on:
  pull_request:
    branches: [main]
    paths:
      - "local-test-runner/**"
      - "tests/test_secure_repo_runner.py"
      - "tests/test_repo_runner_exposure_guard.py"
      - ".github/workflows/secure-repo-runner.yml"
      - "compose.public.yaml"
      - "public/gateway/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  broker-security-tests:
    name: Offline broker security tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Parse standalone runner code
        run: python3 -m compileall -q local-test-runner
      - name: Exercise malicious inputs and Docker isolation checks (mocked)
        run: python3 -m unittest discover -s tests -p "test_secure_repo_runner.py" -v
      - name: Check remote execution denial policy
        run: python3 -m unittest discover -s tests -p "test_repo_runner_exposure_guard.py" -v

  windows-offline-contract:
    name: Windows broker input validation
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate Windows-local path and input handling without Docker execution
        shell: pwsh
        run: python -m unittest discover -s tests -p "test_secure_repo_runner.py" -v

  actual-docker-sandbox:
    name: Disposable Docker isolation smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build the reviewed disposable test image
        run: docker build -t dockerlocal-regression-sandbox:review local-test-runner
      - name: Verify offline sandbox from a synthetic Git commit
        run: python3 tests/smoke_secure_repo_runner.py
      - name: Generate complete image SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: dockerlocal-regression-sandbox:review
          format: cyclonedx
          output: image-sbom.cdx.json
          exit-code: "0"
          cache: "false"
      - name: Enforce no HIGH or CRITICAL vulnerabilities in image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: dockerlocal-regression-sandbox:review
          severity: HIGH,CRITICAL
          vuln-type: os,library
          scanners: vuln
          ignore-unfixed: "false"
          exit-code: "1"
          format: table
          cache: "false"
      - name: Preserve reviewed SBOM for audit
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: secure-test-runner-sbom
          path: image-sbom.cdx.json
          if-no-files-found: error
          retention-days: 14
