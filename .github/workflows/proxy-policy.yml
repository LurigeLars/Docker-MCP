name: Docker proxy policy

on:
  push:
    branches: [main]
    paths:
      - "proxy.py"
      - "tests/test_proxy_policy.py"
      - ".github/workflows/proxy-policy.yml"
  pull_request:
    branches: [main]
    paths:
      - "proxy.py"
      - "tests/test_proxy_policy.py"
      - ".github/workflows/proxy-policy.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Compile Python entrypoints
        run: python -m py_compile proxy.py server.py

      - name: Test proxy allowlist and runtime drift policy
        run: python -m unittest tests.test_proxy_policy
