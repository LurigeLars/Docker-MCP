name: PowerShell syntax

on:
  push:
    branches: [main]
    paths:
      - "**/*.ps1"
      - "server.py"
      - "compose.public.yaml"
      - "public/gateway/**"
      - "tests/test_*_hardening.py"
      - ".github/workflows/powershell-syntax.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    # pull_request has no paths filter so that the required gate always reports; this job
    # applies the same filter and the jobs below are skipped when nothing relevant changed.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != pull_request ]; then echo run=true >> "$GITHUB_OUTPUT"; exit 0; fi
          # The PR merge commit: HEAD^1 is the base, so this diff is exactly the PR's changes.
          if git diff --quiet HEAD^1 HEAD -- ':(glob)**/*.ps1' ':(glob)server.py' ':(glob)compose.public.yaml' ':(glob)public/gateway/**' ':(glob)tests/test_*_hardening.py' ':(glob).github/workflows/powershell-syntax.yml'; then
            echo run=false >> "$GITHUB_OUTPUT"
          else
            echo run=true >> "$GITHUB_OUTPUT"
          fi

  parse:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $Failed = $false
          $Files = Get-ChildItem -Path . -Recurse -Filter *.ps1 -File

          foreach ($File in $Files) {
            $Tokens = $null
            $Errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $File.FullName,
              [ref]$Tokens,
              [ref]$Errors
            )

            if ($Errors.Count -gt 0) {
              $Failed = $true
              Write-Host "::error file=$($File.FullName)::PowerShell parse failure"
              foreach ($ParseError in $Errors) {
                Write-Host "$($ParseError.Extent.StartLineNumber):$($ParseError.Extent.StartColumnNumber) $($ParseError.Message)"
              }
            }
          }

          if ($Failed) {
            exit 1
          }

          Write-Host "Parsed $($Files.Count) PowerShell scripts successfully."

      - name: Run mcp-edge hardening regression tests
        shell: pwsh
        run: python -m unittest discover -s tests -p "test_*_hardening.py" -v

      - name: Run maintenance runner regression self-test
        shell: pwsh
        run: |
          ./maintenance-runner.ps1 -SelfTest

      - name: Verify maintenance runner stays hidden
        shell: pwsh
        run: |
          $Installer = Get-Content ./install-maintenance-runner.ps1 -Raw
          if ($Installer -notmatch 'wscript\.exe') { throw "Hidden WScript launcher missing." }
          if ($Installer -notmatch 'shell\.Run.+, 0, False') { throw "Runner launcher is not configured with SW_HIDE." }
          if ($Installer -notmatch 'Set-ItemProperty.+DockerLocalMaintenanceRunner') { throw "Logon autostart registration missing." }

  gate:
    name: gate (powershell-syntax)
    if: always()
    needs: [changes, parse]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed or be skipped by the path filter
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::A job in this workflow ended with: $result"; exit 1 ;;
            esac
          done
