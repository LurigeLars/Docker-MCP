name: PowerShell syntax

on:
  push:
    branches: [main]
    paths:
      - "**/*.ps1"
      - "server.py"
      - "compose.public.yaml"
      - "public/gateway/**"
      - "tests/test_*_hardening.py"
      - ".github/workflows/powershell-syntax.yml"
  pull_request:
    branches: [main]
    paths:
      - "**/*.ps1"
      - "server.py"
      - "compose.public.yaml"
      - "public/gateway/**"
      - "tests/test_*_hardening.py"
      - ".github/workflows/powershell-syntax.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  parse:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $Failed = $false
          $Files = Get-ChildItem -Path . -Recurse -Filter *.ps1 -File

          foreach ($File in $Files) {
            $Tokens = $null
            $Errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $File.FullName,
              [ref]$Tokens,
              [ref]$Errors
            )

            if ($Errors.Count -gt 0) {
              $Failed = $true
              Write-Host "::error file=$($File.FullName)::PowerShell parse failure"
              foreach ($ParseError in $Errors) {
                Write-Host "$($ParseError.Extent.StartLineNumber):$($ParseError.Extent.StartColumnNumber) $($ParseError.Message)"
              }
            }
          }

          if ($Failed) {
            exit 1
          }

          Write-Host "Parsed $($Files.Count) PowerShell scripts successfully."

      - name: Run mcp-edge hardening regression tests
        shell: pwsh
        run: python -m unittest discover -s tests -p "test_*_hardening.py" -v

      - name: Run maintenance runner regression self-test
        shell: pwsh
        run: |
          ./maintenance-runner.ps1 -SelfTest

      - name: Verify maintenance runner stays hidden
        shell: pwsh
        run: |
          $Installer = Get-Content ./install-maintenance-runner.ps1 -Raw
          if ($Installer -notmatch 'wscript\.exe') { throw "Hidden WScript launcher missing." }
          if ($Installer -notmatch 'shell\.Run.+, 0, False') { throw "Runner launcher is not configured with SW_HIDE." }
          if ($Installer -notmatch 'Set-ItemProperty.+DockerLocalMaintenanceRunner') { throw "Logon autostart registration missing." }
