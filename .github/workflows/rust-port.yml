name: Rust port

on:
  push:
    branches: [main]
    paths: ["rust/**", ".github/workflows/rust-port.yml"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    # pull_request has no paths filter so that the required gate always reports; this job
    # applies the same filter and the jobs below are skipped when nothing relevant changed.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != pull_request ]; then echo run=true >> "$GITHUB_OUTPUT"; exit 0; fi
          # The PR merge commit: HEAD^1 is the base, so this diff is exactly the PR's changes.
          if git diff --quiet HEAD^1 HEAD -- ':(glob)rust/**' ':(glob).github/workflows/rust-port.yml'; then
            echo run=false >> "$GITHUB_OUTPUT"
          else
            echo run=true >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    name: Rust port / locked build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The image build runs `cargo test --locked` and `cargo build --locked`.
      - name: Build image
        run: docker build -t dockerlocal-rs:ci rust

      - name: Report image size
        run: docker image inspect dockerlocal-rs:ci --format '{{.Size}}'

  gate:
    name: gate (rust-port)
    if: always()
    needs: [changes, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed or be skipped by the path filter
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::A job in this workflow ended with: $result"; exit 1 ;;
            esac
          done
