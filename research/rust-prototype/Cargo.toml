[package]
name = "dockerlocal-rs"
version = "0.0.0"
edition = "2024"
publish = false
description = "Research prototype: five read-only DockerLocal tools in Rust for a resource comparison. Not deployed."

[dependencies]
rmcp = { version = "=3.11.0", default-features = false, features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["rt", "macros", "io-std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
ureq = { version = "3", default-features = false }
regex-lite = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
