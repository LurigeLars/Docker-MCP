[package]
name = "dockerlocal-rs"
version = "0.0.0"
edition = "2024"
publish = false
description = "DockerLocal MCP server in Rust, ported from server.py tool by tool with parity checks. Not deployed yet."

[dependencies]
rmcp = { version = "=3.11.0", default-features = false, features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["rt", "macros", "io-std"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
schemars = "1"
ureq = { version = "3", default-features = false }
regex = "1"
uuid = { version = "1", features = ["v4"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
