name: dockerlocal
title: DockerLocal
type: server
image: dockerlocal-mcp:local
description: >
  Restricted local Docker Desktop inspection, selected maintenance and
  Docker Scout analysis. DockerLocal itself has no raw Docker socket.
longLived: true
env:
  - name: DOCKER_API_URL
    value: http://host.docker.internal:23750
  - name: DOCKER_SCOUT_CACHE_DIR
    value: /tmp/docker-scout
  - name: DOCKER_SCOUT_NEW_VERSION_WARN
    value: "false"
extraHosts:
  - host.docker.internal:host-gateway
allowHosts:
  - host.docker.internal:23750
  - scout.docker.com:443
  - api.scout.docker.com:443
  - hub.docker.com:443
  - registry-1.docker.io:443
  - registry.hub.docker.com:443
  - auth.docker.io:443
  - production.cloudflare.docker.com:443
  - registry.npmjs.org:443
  - pypi.org:443
  - files.pythonhosted.org:443
  - proxy.golang.org:443
  - api.nuget.org:443
  - repo1.maven.org:443
  - rubygems.org:443
tools:
  - name: containers_list
  - name: container_inspect
  - name: container_logs
  - name: container_stats
  - name: compose_status
  - name: mcp_deployment_audit
  - name: image_usage_audit
  - name: cleanup_stale_mcp_containers
  - name: cleanup_superseded_images
  - name: compose_redeploy
  - name: maintenance_job_status
  - name: maintenance_runner_status
  - name: images_list
  - name: image_inspect
  - name: image_pull
  - name: container_restart
  - name: image_prune_dangling
  - name: scout_quickview
  - name: scout_cves
  - name: scout_recommendations
  - name: scout_sbom
  - name: scout_compare
